# ~/.tmux.conf on the build VM: settings for the "lab" session
set -g mouse on              # scroll back with the trackpad or mouse wheel
set -g history-limit 50000   # keep a long scrollback
# When a terminal connects to the session, signal "lab-attached" (a script can wait on it: tmux wait-for lab-attached)
set-hook -g client-attached 'run-shell "tmux wait-for -S lab-attached"'
