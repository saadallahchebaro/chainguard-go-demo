# After a merge to main: run the gate again on what was merged, then push, sign and deploy.
name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: deploy
jobs:
  deploy:
    runs-on: [self-hosted, lab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1, pinned by commit
      - run: ./gate.sh
      - run: ./deploy.sh
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
